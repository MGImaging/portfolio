<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="960" height="360" rx="14" fill="#0f2a35"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fd1e3"/></marker></defs>
<text x="40" y="50" fill="#fff" font-size="24" font-weight="700">Control in action: show-to-show host handoff</text>
<text x="40" y="80" fill="#9fc3cf" font-size="16">A click that looks right isn't enough. The handoff counts only after the room confirms it.</text>
<g font-weight="600" text-anchor="middle">
<rect x="40" y="120" width="250" height="110" rx="14" fill="#16404f" stroke="#7fd1e3" stroke-width="2"/>
<text x="165" y="160" fill="#7fd1e3" font-size="14">STEP 1</text><text x="165" y="190" fill="#fff" font-size="21">Next host invited</text><text x="165" y="214" fill="#9fc3cf" font-size="14" font-weight="400">agent sends co-host invite</text>
<rect x="355" y="120" width="250" height="110" rx="14" fill="#16404f" stroke="#7fd1e3" stroke-width="2"/>
<text x="480" y="160" fill="#7fd1e3" font-size="14">STEP 2 · VERIFY</text><text x="480" y="190" fill="#fff" font-size="21">Guest list shows</text>
<rect x="430" y="200" width="100" height="24" rx="12" fill="#f2b84b"/><text x="480" y="217" fill="#0f2a35" font-size="14">COHOST</text>
<rect x="670" y="120" width="250" height="110" rx="14" fill="#123744" stroke="#f2b84b" stroke-width="2"/>
<text x="795" y="160" fill="#f2b84b" font-size="14">STEP 3</text><text x="795" y="190" fill="#fff" font-size="21">Handoff counted</text><text x="795" y="214" fill="#9fc3cf" font-size="14" font-weight="400">logged as done</text>
</g>
<g stroke="#7fd1e3" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M292 175H351"/><path d="M607 175H666"/></g>
<path d="M480 232V290H165V234" stroke="#e57b6e" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="490" y="282" fill="#e57b6e" font-size="15">not confirmed → retry, then escalate</text>
</svg>
